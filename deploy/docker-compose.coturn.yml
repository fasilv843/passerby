# Run coturn on a VM with a public IP:
#   TURN_SECRET=$(openssl rand -hex 32) docker compose -f deploy/docker-compose.coturn.yml up -d
# Use the same TURN_SECRET in the Passerby server's environment.
services:
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Host networking avoids mapping the whole relay port range through Docker.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # - /etc/letsencrypt/live/turn.example.com:/etc/coturn/certs:ro
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET}"]
