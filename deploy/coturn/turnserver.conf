# coturn config for Passerby.
# Clients never see the secret: the Passerby server signs short-lived
# credentials with it (see server/src/configs/iceServers.ts).

listening-port=3478
tls-listening-port=5349

# Relay port range. Open these UDP ports in your firewall / security group.
min-port=49160
max-port=49200

# Required when the host is behind NAT (most cloud VMs). Use the VM's public IP,
# or "public-ip/private-ip" if the network interface only has the private one.
# external-ip=203.0.113.10/10.0.0.5

realm=passerby
fingerprint

# Time-limited credentials (TURN REST API). The secret is passed on the
# command line in docker-compose.yml so it isn't committed here.
use-auth-secret
# static-auth-secret=set-via-command-line

# TLS for turns: (port 5349). Point these at real certificates, e.g. from Let's Encrypt.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# Don't let clients use the relay to reach private networks on the server side.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits: allocations per user, and drop stale nonces after 10 minutes.
user-quota=12
total-quota=1200
stale-nonce=600

no-cli
log-file=stdout
simple-log
