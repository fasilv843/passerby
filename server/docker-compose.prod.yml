
networks:
  passerby-network:
    name: passerby-network
    driver: bridge

services:
  passerby-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET_ENV: production
    image: passerby:production
    container_name: passerby-app
    # volumes:
    #   - .:/app
    #   - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - passerby-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - passerby-network
    volumes:
      - passerby-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - passerby-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      retries: 5

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - passerby-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - passerby-network
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  passerby-redis:
  # node_modules:
  grafana-storage: 
