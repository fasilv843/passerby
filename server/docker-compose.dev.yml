
networks:
  passerby-network:
    name: passerby-network
    driver: bridge

services:
  passerby-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: passerby:development
    container_name: passerby-app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    networks:
      - passerby-network

  grafana-alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - alloy-data:/var/lib/alloy
      # Needed for Docker log collection
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --stability.level=experimental
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    depends_on:
      - passerby-app
    networks:
      - passerby-network

volumes:
  alloy-data:
  node_modules:
